<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1222">
  <title>Determination Anchor</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">No Vacuum Rule</p>
        <h1>Determination Anchor</h1>
        <p class="subtitle">A calm local-first cockpit for choosing your next useful state.</p>
      </div>
      <div class="status-pill" id="installStatus">Offline-ready</div>
    </header>

    <nav class="tabs" aria-label="Main tabs">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="anchor">Anchor Me</button>
      <button class="tab" data-tab="current">Current Anchor</button>
      <button class="tab" data-tab="bank">Activity Bank</button>
      <button class="tab" data-tab="data">About / Data</button>
    </nav>

    <main>
      <section id="dashboard" class="panel active"></section>
      <section id="anchor" class="panel"></section>
      <section id="current" class="panel"></section>
      <section id="bank" class="panel"></section>
      <section id="data" class="panel"></section>
    </main>
  </div>

  <dialog id="switchDialog" class="modal"></dialog>
  <dialog id="activityDialog" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
